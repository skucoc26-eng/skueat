<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056a8" />
      <stop offset="100%" stop-color="#ff7a00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="90" height="90" x="5" y="5" rx="24" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Map Pin & Spoon/Fork/Food Motif -->
  <!-- Cute Steaming Bowl & Fork -->
  <path d="M28 50 C28 66, 40 73, 50 73 C60 73, 72 66, 72 50 Z" fill="#ffffff" />
  
  <!-- Bowl Rim -->
  <rect x="25" y="46" width="50" height="6" rx="3" fill="#ffffff" />
  
  <!-- Chopsticks / Fork Accent -->
  <line x1="38" y1="36" x2="68" y2="44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="38" y1="31" x2="68" y2="39" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Steam Curves -->
  <path d="M42 26 C40 22, 44 18, 42 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M50 24 C48 20, 52 16, 50 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M58 26 C56 22, 60 18, 58 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  
  <!-- Small Star / Sparkle in Top Right -->
  <path d="M74 20 L76 25 L81 27 L76 29 L74 34 L72 29 L67 27 L72 25 Z" fill="#ffd700" opacity="0.95"/>
</svg>
