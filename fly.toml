# fly.toml app configuration file for skueat
# Generated by Antigravity

app = "skueat-coc"
primary_region = "icn" # 서울/인천 리전 (속도가 가장 빠릅니다)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "skueat_data"
  destination = "/app/data"
